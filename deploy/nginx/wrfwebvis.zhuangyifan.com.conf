# Included inside nginx's http context (sites-enabled).
# 2026-11-06：权限改由网页后端的账号登录负责（wrf_webvis/app/core/access.py）。
# 以前这里按 IP 白名单拦截所有写请求，会把登录请求也挡掉，已去掉。
# nginx 只负责 https 和转发；X-Real-IP / X-Forwarded-For 必须照下面这样覆盖写入，
# 后端靠它们区分“公网访问（要登录）”和“本机直连（root）”。

upstream wrfwebvis_backend {
    server 127.0.0.1:18000;
    keepalive 16;
}

map $http_upgrade $wrfwebvis_connection {
    default upgrade;
    '' '';
}

server {
    listen 80;
    listen [::]:80;
    server_name wrfwebvis.zhuangyifan.com;
    access_log /var/log/nginx/wrfwebvis_access.log;
    error_log /var/log/nginx/wrfwebvis_error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 403; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wrfwebvis.zhuangyifan.com;
    ssl_certificate /etc/letsencrypt/live/wrfwebvis.zhuangyifan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wrfwebvis.zhuangyifan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/wrfwebvis_access.log;
    error_log /var/log/nginx/wrfwebvis_error.log;

    # 网页上传文献（PDF）需要比默认 1 MB 更大的请求体；AI 助手的流式回答（SSE）由后端的
    # X-Accel-Buffering: no 关闭缓冲，这里不用另外设置。
    client_max_body_size 200m;

    location / {
        proxy_pass http://wrfwebvis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append untrusted visitor-provided source headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wrfwebvis_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
